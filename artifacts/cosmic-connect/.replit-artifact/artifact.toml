kind = "web"
previewPath = "/"
title = "Cosmic Connect"
version = "1.0.0"
id = "artifacts/cosmic-connect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26031

[services.development]
run = "pnpm --filter @workspace/cosmic-connect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cosmic-connect", "run", "build" ]
publicDir = "artifacts/cosmic-connect/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26031"
BASE_PATH = "/"
