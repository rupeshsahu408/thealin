services:
  # ─── Backend API Server ────────────────────────────────────────────────────
  - type: web
    name: thealins-api
    env: node
    region: oregon
    plan: free
    buildCommand: corepack prepare pnpm@10.26.1 --activate && pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: static
    name: thealins-frontend
    buildCommand: corepack prepare pnpm@10.26.1 --activate && pnpm install && BASE_PATH=/ PORT=3000 NODE_ENV=production pnpm --filter @workspace/cosmic-connect run build
    staticPublishPath: artifacts/cosmic-connect/dist/public
    envVars:
      - key: VITE_API_BASE_URL
        value: https://thealins-api.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
